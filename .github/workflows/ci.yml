# Install dependencies, lint, run the test suite across the supported Python
# versions, and check that the distribution still builds.
#
# This project is retired: its functionality lives on in Raven as
# `raven-arxiv-search`, which has moved on independently. The workflow is kept
# so the repository does not rot silently, not as something to copy — for a
# current pure-Python example, read chandra's ci.yml, which is maintained.
#
# There is no `publish` job: the package is not on PyPI and has no trusted
# publisher configured, so such a job could only ever fail.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        # 3.15 is at rc1, which the setup-python manifest marks unstable, so a bare
        # "3.15" resolves to nothing without this. Versions with a stable release
        # are unaffected — the prerelease is only a fallback when no stable one
        # satisfies the request. Becomes a no-op once 3.15 final ships.
        allow-prereleases: true
    - name: Install PDM
      run: |
        python -m pip install --upgrade pip
        pip install pdm
    - name: Install dependencies
      run: |
        # Point PDM at the interpreter `setup-python` already installed, rather than
        # letting it fetch a second one — its index has no prerelease build, so asking
        # for a version like "3.15" fails while that very interpreter is on PATH.
        # Ask Python for its own path: under Git Bash on Windows, `which python` gives
        # an MSYS path that PDM, a native Windows program, cannot resolve.
        pdm use -f "$(python -c 'import sys; print(sys.executable)')"
        pdm install
    - name: Lint with ruff
      run: pdm run ruff check . --ignore SIM103
    - name: Lint advisories (non-blocking)
      run: pdm run ruff check . --select SIM103 || true
    - name: Run tests
      run: |
        pdm run pytest tests/ -v

  build-dist:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
